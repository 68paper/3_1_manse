<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a221b">
<title>3·1 만세 전야</title>
<meta name="description" content="『3·1 만세 전야』 규칙을 그대로 쓰는 혼자 하는 짧은 퍼즐">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="app">

  <!-- 타이틀 -->
  <section class="screen" id="screen-title" data-screen="title">
    <div id="title-flag"></div>
    <h1>3·1 만세 전야</h1>
    <div class="menu">
      <!-- 놀이 방법마다: 버튼(이름 + 한 줄 설명) + ⓘ(설명 카드). 설명 글은 texts/title.md -->
      <div class="menu-row">
        <button class="primary menu-main" data-nav="tutorial"><span class="mi-title">첫 걸음</span><span class="mi-line" data-text="title.tutorial.line"></span></button>
        <button class="menu-info" data-info="tutorial" aria-label="첫 걸음 설명">ⓘ</button>
      </div>
      <div class="menu-row">
        <button class="menu-main" data-nav="endless-start"><span class="mi-title">스무하루의 밤</span><span class="mi-line" data-text="title.endless.line"></span></button>
        <button class="menu-info" data-info="endless" aria-label="스무하루의 밤 설명">ⓘ</button>
      </div>
      <div class="menu-row">
        <button class="menu-main" data-nav="crackdown-start"><span class="mi-title">단속의 밤</span><span class="mi-line" data-text="title.crackdown.line"></span></button>
        <button class="menu-info" data-info="crackdown" aria-label="단속의 밤 설명">ⓘ</button>
      </div>
      <div class="menu-row">
        <button class="menu-main" data-nav="practice-setup"><span class="mi-title">자유 연습</span><span class="mi-line" data-text="title.practice.line"></span></button>
        <button class="menu-info" data-info="practice" aria-label="자유 연습 설명">ⓘ</button>
      </div>
      <div class="menu-row">
        <a class="menu-link menu-main" href="link.html"><span class="mi-title">기기끼리 함께하기 <span class="beta">시험판</span></span><span class="mi-line" data-text="title.link.line"></span></a>
        <button class="menu-info" data-info="link" aria-label="기기끼리 함께하기 설명">ⓘ</button>
      </div>
      <div class="menu-row">
        <button class="grow" data-nav="rules">규칙 보기</button>
        <button class="ghost grow" data-nav="settings">설정</button>
      </div>
    </div>
    <p class="maker">만든 사람 우치</p>
  </section>

  <!-- 자유 연습: 자리 구성 -->
  <section class="screen" id="screen-practice-setup" data-screen="practice-setup">
    <div class="topbar"><button class="btn-back" data-nav="title">←</button><div class="title">자유 연습</div></div>
    <p class="muted">AI나 친구와 함께 여덟 밤을 겨뤄요.</p>
    <div class="setup-label">인원</div>
    <div class="seg" id="setup-count">
      <button data-count="3">3명</button><button data-count="4">4명</button><button data-count="5">5명</button>
    </div>
    <div class="setup-label">자리</div>
    <div id="setup-seats" class="stack"></div>
    <datalist id="saved-names"></datalist>
    <p class="muted" id="setup-hint"></p>
    <button class="primary" id="btn-practice-start">시작하기</button>
  </section>

  <!-- 자유 연습: 첫 밤 순서 정하기(각자 주사위를 굴려 눈이 큰 사람부터) -->
  <section class="screen" id="screen-first-roll" data-screen="first-roll">
    <div class="topbar"><button class="btn-back" data-nav="practice-setup">←</button><div class="title">순서 정하기</div></div>
    <p class="muted" id="roll-hint"></p>
    <div id="roll-seats" class="roll-seats"></div>
    <button class="primary" id="btn-roll-start" hidden>이 순서로 시작하기</button>
  </section>

  <!-- 첫 걸음: 과정 처음 화면(이어 하기 · 장면 목록 · 건너뛰기) -->
  <section class="screen" id="screen-tutorial" data-screen="tutorial">
    <div class="topbar"><button class="btn-back" data-nav="title">←</button><div class="title">첫 걸음</div></div>
    <div id="tut-home" class="stack"></div>
  </section>

  <!-- 첫 걸음: 이야기 · 주사위 · 정리 카드 -->
  <section class="screen" id="screen-tutorial-card" data-screen="tutorial-card">
    <div class="topbar"><button class="btn-back" id="btn-tut-card-exit">←</button><div class="title" id="tut-card-title">첫 걸음</div><div class="tut-dots" id="tut-card-dots"></div></div>
    <div id="tut-card" class="tut-card"></div>
    <div class="spacer"></div>
    <div id="tut-card-actions" class="stack"></div>
  </section>

  <!-- 규칙 보기 -->
  <section class="screen" id="screen-rules" data-screen="rules">
    <div class="topbar"><button class="btn-back" data-nav="title">←</button><div class="title">규칙 보기</div></div>
    <div id="rules-content" class="stack"></div>
  </section>

  <!-- 설정 -->
  <section class="screen" id="screen-settings" data-screen="settings">
    <div class="topbar"><button class="btn-back" data-nav="title">←</button><div class="title">설정</div></div>
    <div class="setting-row">
      <div>
        <div>도움 표시</div>
        <div class="muted" style="font-size:12px;">놓으면 흩어지는 칸을 빨간 테두리로 보여줘요</div>
      </div>
      <label class="switch"><input type="checkbox" id="toggle-hints"><span class="track"></span><span class="knob"></span></label>
    </div>
    <div class="setting-row">
      <div>
        <div>배경음</div>
        <div class="muted" style="font-size:12px;">3/4박자의 낮고 무거운 가락</div>
      </div>
      <label class="switch"><input type="checkbox" id="toggle-bgm"><span class="track"></span><span class="knob"></span></label>
    </div>
    <div class="setting-row">
      <div>
        <div>효과음</div>
        <div class="muted" style="font-size:12px;">놓기 · 모둠 · 흩어짐마다 울리는 북소리</div>
      </div>
      <label class="switch"><input type="checkbox" id="toggle-sfx"><span class="track"></span><span class="knob"></span></label>
    </div>
    <div class="spacer"></div>
    <p class="muted center" style="font-size:12px;">3·1 만세 전야 · 모바일 1인 퍼즐 테스트판</p>
  </section>

  <!-- 게임 -->
  <section class="screen" id="screen-game" data-screen="game">
    <div class="game-topbar">
      <button class="btn-back" id="btn-game-exit">←</button>
      <div class="lanterns" id="lanterns"></div>
      <button class="quit-btn" id="btn-game-rules" aria-haspopup="dialog">규칙</button>
      <div class="score-badge" id="score-badge">0점</div>
      <button class="quit-btn" id="btn-game-quit" hidden>종료</button>
    </div>
    <div class="cd-status" id="cd-status" hidden></div>
    <div class="score-track" id="score-track" hidden></div>
    <div class="players-bar" id="players-bar" hidden></div>
    <div class="coach" id="coach" hidden></div>
    <div class="cd-panel" id="cd-panel" hidden></div>
    <div class="board-wrap"><div class="board" id="board"></div></div>
    <div class="message" id="game-message"></div>
    <div class="pool-wrap">
      <div class="pool" id="pool"></div>
      <div class="placements-left" id="placements-left"></div>
    </div>
    <div class="record-sheet" id="record-sheet"></div>
    <div class="story-panel" id="story-panel" hidden></div>
  </section>

  <!-- 새벽 결과 -->
  <section class="screen" id="screen-dawn" data-screen="dawn">
    <div id="dawn-sky"><div class="dawn-caption" id="dawn-caption">여덟 번째 등잔이 꺼졌습니다.</div></div>
    <div id="dawn-paint-area"></div>
    <div class="center" style="margin-bottom:10px;">
      <button class="ghost" id="dawn-skip">건너뛰기</button>
    </div>
    <div id="dawn-result" hidden>
      <div class="score-line" id="dawn-score-line"></div>
      <div class="stars-line" id="dawn-stars-line"></div>
      <div class="goal-line" id="dawn-goal-line"></div>
      <div class="score-track dawn-track" id="dawn-track" hidden></div>
      <ol class="ranking" id="dawn-ranking" hidden></ol>
      <div class="dawn-story" id="dawn-story" hidden></div>
      <div class="actions">
        <button id="btn-dawn-again">다시 하기</button>
        <button class="ghost" id="btn-dawn-home">처음으로</button>
      </div>
    </div>
  </section>

  <div class="overlay-panel" id="overlay-panel" hidden></div>
  <div class="modal" id="info-modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="info-modal-title">
      <h3 id="info-modal-title"></h3>
      <div class="modal-goal" id="info-modal-tag"></div>
      <div class="modal-body" id="info-modal-body"></div>
      <button class="primary" id="info-modal-close">닫기</button>
    </div>
  </div>
  <!-- 처음 화면 ⓘ: 놀이 방법 설명 카드(아래에서 올라옴) -->
  <div class="modal sheet" id="mode-sheet" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="mode-sheet-title">
      <h3 id="mode-sheet-title"></h3>
      <div class="modal-body" id="mode-sheet-body"></div>
      <div id="mode-sheet-actions" class="sheet-actions"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script type="module" src="js/ui.js"></script>
</body>
</html>
